<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEPURO LINKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #140423;
    --grid: rgba(200, 100, 255, 0.22);
    --violet: #c04dff;
    --violet-bright: #e879ff;
    --violet-dim: #7a2ee6;
    --glow: rgba(200, 90, 255, 0.65);
    --panel: rgba(40, 12, 65, 0.5);
    --panel-border: rgba(200, 110, 255, 0.35);
    --text: #f1e6ff;
    --text-dim: #a488c4;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
  }

  body{
    font-family:'Space Mono', ui-monospace, Consolas, monospace;
    color:var(--text);
  }

  .page{
    position:relative;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .grid-bg{
    position:absolute;
    inset:-50px;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px;
    z-index:0;
    animation: grid-drift 26s linear infinite;
  }

  @keyframes grid-drift{
    0%{ background-position: 0 0, 0 0; }
    100%{ background-position: 42px 42px, 42px 42px; }
  }

  .vignette{
    position:absolute;
    inset:0;
    z-index:1;
    background: radial-gradient(circle at 50% 15%, rgba(200,90,255,0.26), transparent 58%),
                radial-gradient(circle at 50% 105%, rgba(0,0,0,0.75), transparent 60%);
    pointer-events:none;
  }

  .cursor-glow{
    position:absolute;
    width:320px;
    height:320px;
    border-radius:50%;
    background: radial-gradient(circle, var(--glow) 0%, rgba(190,90,255,0.16) 42%, transparent 72%);
    pointer-events:none;
    z-index:2;
    transform:translate(-50%,-50%);
    filter: blur(4px);
    transition: opacity 0.3s ease;
    opacity:0;
    mix-blend-mode: screen;
  }

  .content{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:720px;
  }

  .logo{
    font-family:'Unbounded', 'Space Mono', sans-serif;
    font-weight:900;
    font-size:clamp(42px, 9vw, 68px);
    letter-spacing:-0.5px;
    line-height:1;
    background: linear-gradient(90deg, var(--violet-bright), var(--violet), #ff9df9);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter: drop-shadow(0 0 28px var(--glow));
    margin-bottom:16px;
    opacity:0;
    animation: appear 0.8s ease forwards;
  }

  .subtitle{
    color:var(--text-dim);
    font-size:16px;
    letter-spacing:3px;
    margin-bottom:60px;
    opacity:0;
    animation: appear 0.8s ease 0.15s forwards;
  }

  @keyframes appear{
    from{ opacity:0; transform:translateY(-10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .row{
    width:100%;
    display:flex;
    align-items:stretch;
    gap:16px;
    margin-bottom:22px;
    opacity:0;
    animation: rise 0.7s ease 0.35s forwards;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .btn{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    padding:30px 36px;
    border-radius:20px;
    color:var(--text);
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
    border:1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    overflow:hidden;
    isolation:isolate;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .btn::before{
    content:"";
    position:absolute;
    inset:-1px;
    z-index:-1;
    background: linear-gradient(120deg, transparent, rgba(220,120,255,0.45), transparent);
    background-size: 200% 100%;
    animation: sheen 3.5s ease-in-out infinite;
    opacity:0.7;
  }

  @keyframes sheen{
    0%{ background-position: 200% 0; }
    100%{ background-position: -200% 0; }
  }

  .btn:hover{
    transform: translateY(-3px);
    border-color: var(--violet-bright);
    box-shadow: 0 8px 34px rgba(200,90,255,0.35), 0 0 0 1px rgba(220,120,255,0.2) inset;
  }

  .btn:active{
    transform: translateY(-1px) scale(0.98);
  }

  .btn .arrow{
    color:var(--violet-bright);
    font-size:26px;
    transition: transform 0.25s ease;
  }
  .btn:hover .arrow{
    transform: translateX(4px);
  }

  .promo{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 28px;
    border-radius:18px;
    border:1px dashed var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    font-size:16px;
    letter-spacing:1px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  .promo b{
    color:var(--violet-bright);
    font-size:18px;
    text-shadow:0 0 14px var(--glow);
  }

  .promo-copy{
    cursor:pointer;
    color:var(--violet);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:6px 12px;
    font-size:13px;
    transition: all 0.2s ease;
    background:transparent;
  }
  .promo-copy:hover{
    color:var(--violet-bright);
    border-color:var(--violet-bright);
  }

  @media (max-width: 560px){
    .row{
      flex-direction:column;
    }
    .promo{
      justify-content:center;
      white-space:normal;
    }
  }

  .footer{
    margin-top:20px;
    font-size:11px;
    color:var(--text-dim);
    opacity:0;
    animation: appear 0.8s ease 0.6s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="page" id="page">
  <div class="grid-bg"></div>
  <div class="vignette"></div>
  <div class="cursor-glow" id="glow"></div>

  <div class="content">
    <div class="logo">CEPURO LINKS</div>

    <div class="row">
      <a class="btn" href="https://musor.click/Xpoxs5OF" target="_blank" rel="noopener noreferrer">
        Musor Drop <span class="arrow">›</span>
      </a>
      <div class="promo">
        PROMOCODE: <b id="promo-code">INVUJWKWZ</b>
        <button class="promo-copy" id="copy-btn" title="Скопировать промокод">copy</button>
      </div>
    </div>

  </div>
</div>

<script>
  var page = document.getElementById('page');
  var glow = document.getElementById('glow');
  page.addEventListener('mousemove', function(e){
    var rect = page.getBoundingClientRect();
    glow.style.left = (e.clientX - rect.left) + 'px';
    glow.style.top = (e.clientY - rect.top) + 'px';
    glow.style.opacity = '1';
  });
  page.addEventListener('mouseleave', function(){ glow.style.opacity = '0'; });

  var copyBtn = document.getElementById('copy-btn');
  copyBtn.addEventListener('click', function(){
    var code = 'INVUJWKWZ';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).catch(function(){});
    }
    var old = copyBtn.textContent;
    copyBtn.textContent = 'скопировано';
    setTimeout(function(){ copyBtn.textContent = old; }, 1500);
  });
</script>

</body>
</html>
