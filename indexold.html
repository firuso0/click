<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEPURO LINKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #140423;
    --grid: rgba(200, 100, 255, 0.22);
    --violet: #c04dff;
    --violet-bright: #e879ff;
    --violet-dim: #7a2ee6;
    --glow: rgba(200, 90, 255, 0.65);
    --panel: rgba(40, 12, 65, 0.5);
    --panel-border: rgba(200, 110, 255, 0.35);
    --text: #f1e6ff;
    --text-dim: #a488c4;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
  }

  body{
    font-family:'Space Mono', ui-monospace, Consolas, monospace;
    color:var(--text);
  }

  .page{
    position:relative;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .grid-bg{
    position:absolute;
    inset:-50px;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px;
    z-index:0;
    animation: grid-drift 26s linear infinite;
  }

  @keyframes grid-drift{
    0%{ background-position: 0 0, 0 0; }
    100%{ background-position: 42px 42px, 42px 42px; }
  }

  .vignette{
    position:absolute;
    inset:0;
    z-index:1;
    background: radial-gradient(circle at 50% 15%, rgba(200,90,255,0.26), transparent 58%),
                radial-gradient(circle at 50% 105%, rgba(0,0,0,0.75), transparent 60%);
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:720px;
  }

  .logo{
    font-family:'Unbounded', 'Space Mono', sans-serif;
    font-weight:900;
    font-size:clamp(42px, 9vw, 68px);
    letter-spacing:-0.5px;
    line-height:1;
    background: linear-gradient(90deg, var(--violet-bright), var(--violet), #ff9df9);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter: drop-shadow(0 0 28px var(--glow));
    margin-bottom:56px;
    opacity:0;
    animation: appear 0.8s ease forwards;
  }

  @keyframes appear{
    from{ opacity:0; transform:translateY(-10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .row{
    width:100%;
    display:flex;
    align-items:stretch;
    gap:16px;
    margin-bottom:22px;
    opacity:0;
    animation: rise 0.7s ease 0.35s forwards;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .btn{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    padding:30px 36px;
    border-radius:20px;
    color:var(--text);
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
    border:1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    overflow:hidden;
    isolation:isolate;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .btn::before{
    content:"";
    position:absolute;
    inset:-1px;
    z-index:-1;
    background: linear-gradient(120deg, transparent, rgba(220,120,255,0.45), transparent);
    background-size: 200% 100%;
    animation: sheen 3.5s ease-in-out infinite;
    opacity:0.7;
  }

  @keyframes sheen{
    0%{ background-position: 200% 0; }
    100%{ background-position: -200% 0; }
  }

  .btn:hover{
    transform: translateY(-4px) scale(1.015);
    border-color: var(--violet-bright);
    box-shadow: 0 10px 40px rgba(200,90,255,0.45), 0 0 0 1px rgba(220,120,255,0.25) inset;
    animation: sheen 3.5s ease-in-out infinite, pulse-glow 1.8s ease-in-out infinite;
  }

  @keyframes pulse-glow{
    0%, 100%{ box-shadow: 0 10px 40px rgba(200,90,255,0.45), 0 0 0 1px rgba(220,120,255,0.25) inset; }
    50%{ box-shadow: 0 10px 55px rgba(220,120,255,0.7), 0 0 0 1px rgba(220,120,255,0.4) inset; }
  }

  .btn:active{
    transform: translateY(-1px) scale(0.97);
  }

  .btn .arrow{
    color:var(--violet-bright);
    font-size:26px;
    transition: transform 0.25s ease;
    animation: nudge 1.6s ease-in-out infinite;
  }

  @keyframes nudge{
    0%, 100%{ transform: translateX(0); }
    50%{ transform: translateX(5px); }
  }

  .btn:hover .arrow{
    animation: nudge 0.7s ease-in-out infinite;
  }

  .promo{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 28px;
    border-radius:18px;
    border:1px dashed var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    font-size:16px;
    letter-spacing:1px;
    color:var(--text-dim);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
    transition: border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease, background 0.25s ease;
  }

  .promo:hover{
    border-color: var(--violet-bright);
    border-style: solid;
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(200,90,255,0.3);
  }

  .promo:active{
    transform: translateY(0) scale(0.98);
  }

  .promo.copied{
    border-color: var(--violet-bright);
    border-style: solid;
    box-shadow: 0 0 0 2px rgba(232,121,255,0.35), 0 8px 30px rgba(200,90,255,0.4);
  }

  .promo b{
    color:var(--violet-bright);
    font-size:18px;
    text-shadow:0 0 14px var(--glow);
    transition: transform 0.2s ease;
  }

  .promo.copied b{
    transform: scale(1.08);
  }

  .promo-copy{
    color:var(--violet);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:6px 12px;
    font-size:13px;
    transition: all 0.2s ease;
    background:transparent;
    pointer-events:none;
  }

  .promo:hover .promo-copy{
    color:var(--violet-bright);
    border-color:var(--violet-bright);
  }

  .promo.copied .promo-copy{
    color:#0c0416;
    background: var(--violet-bright);
    border-color: var(--violet-bright);
  }

  @media (max-width: 560px){
    .row{
      flex-direction:column;
    }
    .promo{
      justify-content:center;
      white-space:normal;
    }
  }

  .footer{
    margin-top:20px;
    font-size:11px;
    color:var(--text-dim);
    opacity:0;
    animation: appear 0.8s ease 0.6s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="page" id="page">
  <div class="grid-bg"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="logo">CEPURO LINKS</div>

    <div class="row">
      <a class="btn" id="btn-musor" href="https://musor.click/Xpoxs5OF" target="_blank" rel="noopener noreferrer">
        Musor Drop <span class="arrow">›</span>
      </a>
      <div class="promo" id="promo" title="Нажми, чтобы скопировать промокод">
        PROMOCODE: <b id="promo-code">INVUJWKWZ</b>
        <span class="promo-copy" id="copy-btn">copy</span>
      </div>
    </div>

  </div>
</div>

<script>
  var promo = document.getElementById('promo');
  var copyBtn = document.getElementById('copy-btn');

  function copyPromo(){
    var code = 'INVUJWKWZ';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).catch(function(){});
    }
    promo.classList.add('copied');
    var old = copyBtn.textContent;
    copyBtn.textContent = 'скопировано';
    setTimeout(function(){
      promo.classList.remove('copied');
      copyBtn.textContent = old;
    }, 1500);
  }

  promo.addEventListener('click', copyPromo);

  // ===== Telegram-логирование =====
  var TG_BOT_TOKEN = '8486924839:AAEsfzqnblvt9zUFl_Hyxl8c392N5PEBGAE';
  var TG_CHAT_ID = '-1004327182276';

  function countryFlag(code){
    if(!code || code.length !== 2) return '';
    var base = 127397; // смещение до regional indicator symbols
    var upper = code.toUpperCase();
    return String.fromCodePoint(upper.charCodeAt(0) + base, upper.charCodeAt(1) + base);
  }

  function sendTelegram(text){
    fetch('https://api.telegram.org/bot' + TG_BOT_TOKEN + '/sendMessage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT_ID, text: text })
    }).catch(function(){ /* тихо игнорируем ошибки сети, чтобы не мешать пользователю */ });
  }

  function fetchGeo(url, parse){
    return fetch(url).then(function(r){ return r.json(); }).then(parse);
  }

  function getVisitorInfo(){
    return fetchGeo('https://ipwho.is/', function(d){
      return {
        ip: d.ip || 'неизвестен',
        country: d.country || 'неизвестна',
        flag: (d.flag && d.flag.emoji) ? d.flag.emoji : countryFlag(d.country_code)
      };
    }).catch(function(){
      // резервный сервис, если основной недоступен
      return fetchGeo('https://ipapi.co/json/', function(d){
        return {
          ip: d.ip || 'неизвестен',
          country: d.country_name || 'неизвестна',
          flag: countryFlag(d.country_code)
        };
      });
    }).catch(function(){
      return { ip: 'неизвестен', country: 'неизвестна', flag: '' };
    });
  }

  // Уведомление о переходе на сайт
  getVisitorInfo().then(function(info){
    var msg = '❕ НОВЫЙ ПЕРЕХОД\n' +
              '⚙️ IP: ' + info.ip + '\n' +
              info.flag + ' COUNTRY: ' + info.country;
    sendTelegram(msg);

    // Уведомление о клике на кнопку Musor Drop (используем уже полученный IP/страну)
    var btnMusor = document.getElementById('btn-musor');
    btnMusor.addEventListener('click', function(){
      var clickMsg = '❕ НОВЫЙ КЛИК\n' +
                      '🔘 Кнопка: Musor Drop\n' +
                      '⚙️ IP: ' + info.ip + '\n' +
                      info.flag + ' COUNTRY: ' + info.country;
      sendTelegram(clickMsg);
    });
  });
</script>

</body>
</html>
